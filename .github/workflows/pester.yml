name: pester

on:
  push:
  pull_request:

jobs:
  powershell-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bridge regression scripts
        shell: pwsh
        run: |
          Get-ChildItem tests\Test-*.ps1 | ForEach-Object { & $_.FullName }
  python-tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Python bridge regression scripts
        run: python -m unittest discover -s tests -p "test_*.py"
